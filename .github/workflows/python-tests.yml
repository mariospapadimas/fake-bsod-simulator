name: Python tests

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository and original asset history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Set up Python 3.11
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
      # Tests use only unittest/mocks and Git; no pip dependencies are required.
      - name: Run all headless tests and reject an empty suite
        run: |
          python - <<'PY'
          import sys
          import unittest

          suite = unittest.defaultTestLoader.discover("tests")
          if suite.countTestCases() == 0:
              sys.exit("No tests discovered")
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          if result.testsRun == 0:
              sys.exit("No tests executed")
          sys.exit(0 if result.wasSuccessful() else 1)
          PY
