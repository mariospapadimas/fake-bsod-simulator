name: Pylint

on:
  push:
    paths:
      - "**.py"
  pull_request:
    paths:
      - "**.py"

permissions:
  contents: read

jobs:
  pylint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Python 3.11
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
      - name: Install Pylint
        run: python -m pip install --disable-pip-version-check pylint
      - name: Check Pylint score
        shell: bash
        run: |
          pylint_output="$(pylint src --score=y 2>&1 || true)"
          printf '%s\n' "$pylint_output"

          score="$(printf '%s\n' "$pylint_output" | sed -n 's/.*rated at \(-\{0,1\}[0-9.]\+\)\/10.*/\1/p' | tail -n 1)"
          if [[ -z "$score" ]]; then
            echo "Unable to determine the Pylint score."
            exit 1
          fi

          if awk -v score="$score" 'BEGIN { exit !(score > 9) }'; then
            echo "Pylint score $score is above 9."
          else
            echo "Pylint score $score must be above 9."
            exit 1
          fi
